<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ultra-Mag™ Pallet · WebAR test</title>
  <meta name="theme-color" content="#2e4263">

  <!-- 8th Wall XR Engine (Distributed Engine Binary, includes SLAM world tracking). Not modified. -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <!-- 8th Wall XRExtras + Landing Page helpers (MIT) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1.0.0/dist/landing-page.js" crossorigin="anonymous"></script>

  <script type="importmap">
  {"imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
  }}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
    #camerafeed{position:fixed;inset:0;width:100%;height:100%}
    .hud{position:fixed;left:50%;transform:translateX(-50%);z-index:20;font-family:"DM Mono",ui-monospace,Menlo,monospace;
         text-transform:uppercase;letter-spacing:.2px;color:#2e4263;background:rgba(255,255,255,.9);border-radius:26px;
         padding:9px 16px;font-size:11px;text-align:center;max-width:88vw;pointer-events:none}
    #status{top:calc(env(safe-area-inset-top) + 14px)}
    #brand{bottom:calc(env(safe-area-inset-bottom) + 12px);background:rgba(46,66,99,.85);color:#fff;font-size:9px;line-height:1.5;pointer-events:auto}
    #brand a{color:#8dd8fb}
  </style>
</head>
<body>
  <canvas id="camerafeed"></canvas>
  <div class="hud" id="status">Starting camera…</div>
  <div class="hud" id="brand">
    Source Naturals® Ultra-Mag™ · WebAR test<br>
    World tracking by the XR Engine © 2026 Niantic Spatial, Inc. Used under the
    <a href="XR-ENGINE-LICENSE.txt" target="_blank" rel="noopener">XR Engine License Agreement</a>, provided “as is” without warranty.
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
